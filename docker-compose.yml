name: phishing-pipeline

# Zones:
#   sandbox_net (internal: true) — the sandbox has NO route to the internet (ТЗ 4.5.2.1);
#                                  it only renders/parses objects it receives from the worker.
#   backend_net                  — worker, knowledge base, UI.
#   llm_net     (internal: true) — local LLM server `llm` (Ollama, Qwen models); reachable only by the worker,
#                                  no route to the internet: LLM_MODE=local sends nothing outside (ТЗ 4.4.2).
# `llm-init` downloads the models into the `llm_models` volume once (the only step that needs the internet)
# and exits; with the models already in the volume it works offline.
# Live URL expansion (extended version) is opt-in: `docker compose --profile live-fetch up`
# starts `sandbox-online`, attached to an egress network, and the worker can be pointed at it
# with SANDBOX_HOST=sandbox-online.

x-sandbox: &sandbox-base
  build:
    context: ./services/sandbox
    dockerfile: Dockerfile
  image: phishing-intelligence-pipeline-sandbox:latest
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m
    - /var/run:rw,noexec,nosuid,size=16m
  user: "1000:1000"
  # PID 1 that reaps exited children: headless Chromium and Tesseract leave zombie processes that
  # would otherwise exhaust the pids limit during long batch runs.
  init: true
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 2048M
        pids: 200
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-phishing_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phish_user} -d ${POSTGRES_DB:-phishing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sandbox:
    <<: *sandbox-base
    container_name: sandbox
    environment:
      - PORT=8001
      - ANTI_SSRF_ENABLED=true
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-10}
      - SANDBOX_MAX_REDIRECTS=${SANDBOX_MAX_REDIRECTS:-10}
      - SANDBOX_MAX_FILE_SIZE_MB=${SANDBOX_MAX_FILE_SIZE_MB:-25}
    networks:
      - sandbox_net

  sandbox-online:
    <<: *sandbox-base
    container_name: sandbox-online
    profiles: ["live-fetch"]
    environment:
      - PORT=8001
      - ANTI_SSRF_ENABLED=true
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-10}
      - SANDBOX_MAX_REDIRECTS=${SANDBOX_MAX_REDIRECTS:-10}
      - SANDBOX_MAX_FILE_SIZE_MB=${SANDBOX_MAX_FILE_SIZE_MB:-25}
    networks:
      - sandbox_net
      - egress_net

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    image: phishing-intelligence-pipeline-worker:latest
    container_name: worker
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-phish_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-phishing_db}
      - SANDBOX_HOST=${SANDBOX_HOST_DOCKER:-sandbox}
      - SANDBOX_PORT=8001
      - SANDBOX_INPROCESS_FALLBACK=false
      - LLM_MODE=${LLM_MODE:-local}
      - LLM_LOCAL_BASE_URL=${LLM_LOCAL_BASE_URL_DOCKER:-http://llm:11434/v1}
      - LLM_LOCAL_API_KEY=${LLM_LOCAL_API_KEY:-}
      - LLM_LOCAL_TEXT_MODEL=${LLM_LOCAL_TEXT_MODEL:-qwen3-vl:2b-instruct}
      - LLM_LOCAL_VISION_MODEL=${LLM_LOCAL_VISION_MODEL:-qwen3-vl:2b-instruct}
      - LLM_CLOUD_BASE_URL=${LLM_CLOUD_BASE_URL:-}
      - LLM_CLOUD_API_KEY=${LLM_CLOUD_API_KEY:-}
      - LLM_CLOUD_TEXT_MODEL=${LLM_CLOUD_TEXT_MODEL:-}
      - LLM_CLOUD_VISION_MODEL=${LLM_CLOUD_VISION_MODEL:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4000}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-180}
      - SCORE_CLEAN_THRESHOLD=${SCORE_CLEAN_THRESHOLD:-0.30}
      - SCORE_MALICIOUS_THRESHOLD=${SCORE_MALICIOUS_THRESHOLD:-0.70}
      - DATASET_DIR=/app/file_for_case
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"   # REST API
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./file_for_case:/app/file_for_case:ro
    networks:
      - backend_net
      - sandbox_net
      - llm_net
      - egress_net
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_started
      llm:
        condition: service_started
    restart: unless-stopped

  llm:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: llm
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}   # keep the model in memory between objects of a batch
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_VULKAN=1                              # any Vulkan GPU; falls back to CPU without it
      - OLLAMA_IGPU_ENABLE=1                         # Ollama skips integrated GPUs (Intel Arc / AMD APU) unless asked
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - llm_models:/root/.ollama
    networks:
      - llm_net
    depends_on:
      llm-init:
        condition: service_completed_successfully
    restart: unless-stopped

  llm-init:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: llm-init
    environment:
      - MODELS=${LLM_LOCAL_TEXT_MODEL:-qwen3-vl:2b-instruct} ${LLM_LOCAL_VISION_MODEL:-qwen3-vl:2b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in $$(echo $$MODELS | tr ' ' '\n' | sort -u); do
          ollama show "$$m" >/dev/null 2>&1 && echo "model $$m: present" && continue
          echo "model $$m: downloading" && ollama pull "$$m" || exit 1
        done
    volumes:
      - llm_models:/root/.ollama
    networks:
      - egress_net
    restart: "no"

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    image: phishing-intelligence-pipeline-ui:latest
    container_name: ui
    environment:
      - WORKER_HOST=worker
      - WORKER_PORT=8000
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./file_for_case:/app/file_for_case:ro
      - ./exports:/app/exports:ro
      - ./reports:/app/reports:ro
      - ./logs:/app/logs:ro
    networks:
      - backend_net
    depends_on:
      - worker
    restart: unless-stopped

networks:
  backend_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true
  llm_net:
    driver: bridge
    internal: true
  egress_net:
    driver: bridge

volumes:
  db_data:
  llm_models:
