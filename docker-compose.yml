name: phishing-pipeline

services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phish_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phish_password}
      POSTGRES_DB: ${POSTGRES_DB:-phishing_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - phish_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phish_user} -d ${POSTGRES_DB:-phishing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sandbox:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    image: phishing-intelligence-pipeline-sandbox:latest
    container_name: sandbox
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /var/run:rw,noexec,nosuid,size=16m
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 100
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      - PORT=8001
      - ANTI_SSRF_ENABLED=${ANTI_SSRF_ENABLED:-true}
      - SANDBOX_TIMEOUT_SECONDS=${SANDBOX_TIMEOUT_SECONDS:-10}
      - SANDBOX_MAX_REDIRECTS=${SANDBOX_MAX_REDIRECTS:-10}
    networks:
      - phish_network
    restart: unless-stopped

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    image: phishing-intelligence-pipeline-worker:latest
    container_name: worker
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-phish_user}:${POSTGRES_PASSWORD:-phish_password}@db:5432/${POSTGRES_DB:-phishing_db}
      - SANDBOX_HOST=sandbox
      - SANDBOX_PORT=8001
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_TEXT_MODEL=${LLM_TEXT_MODEL}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-45}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - SCORE_CLEAN_THRESHOLD=${SCORE_CLEAN_THRESHOLD:-0.30}
      - SCORE_MALICIOUS_THRESHOLD=${SCORE_MALICIOUS_THRESHOLD:-0.70}
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
    networks:
      - phish_network
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_started
    restart: unless-stopped

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
    image: phishing-intelligence-pipeline-ui:latest
    container_name: ui
    environment:
      - WORKER_HOST=worker
      - WORKER_PORT=8000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./file_for_case:/app/file_for_case:ro
      - ./exports:/app/exports:ro
      - ./logs:/app/logs
    networks:
      - phish_network
    depends_on:
      - worker
    restart: unless-stopped

networks:
  phish_network:
    driver: bridge

volumes:
  db_data:
